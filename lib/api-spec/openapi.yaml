openapi: 3.1.0
info:
  title: Api
  version: 0.1.0
  description: Gustafta SBU Accelerator - persiapan bukti, bukan keputusan sertifikasi
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
  - name: workspace
paths:
  /documents:
    get:
      operationId: listDocumentVault
      tags: [workspace]
      parameters:
        - { name: q, in: query, schema: { type: string, maxLength: 100 } }
        - { name: category, in: query, schema: { type: string, enum: [legalitas, keuangan, personel, peralatan, pengalaman, smap, lainnya] } }
        - { name: caseId, in: query, schema: { type: integer, minimum: 1 } }
        - { name: page, in: query, schema: { type: integer, minimum: 1, maximum: 10000, default: 1 } }
      responses:
        "200":
          description: Private paginated document vault
          content:
            application/json:
              schema:
                type: object
                required: [userId, documents, total, page, pageSize]
                properties:
                  userId: { type: string }
                  documents:
                    type: array
                    items:
                      allOf:
                        - { $ref: "#/components/schemas/CaseDocument" }
                        - type: object
                          required: [caseName]
                          properties:
                            caseName: { type: string }
                  total: { type: integer }
                  page: { type: integer }
                  pageSize: { type: integer }
  /cases/{id}/documents/{documentId}/analyses:
    parameters:
      - { name: id, in: path, required: true, schema: { type: integer, minimum: 1 } }
      - { name: documentId, in: path, required: true, schema: { type: string, format: uuid } }
    get:
      operationId: listDocumentAnalyses
      tags: [workspace]
      responses:
        "200":
          description: Preliminary analyses for this owner's selected document
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/DocumentAnalysis" }
    post:
      operationId: analyzeCaseDocument
      tags: [workspace]
      security: [{ FormOwner: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/DocumentAnalysisInput" }
      responses:
        "201":
          description: Persisted preliminary analysis, not verified evidence
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DocumentAnalysis" }
        "400": { description: Invalid input or missing consent }
        "404": { description: Document unavailable }
        "409": { $ref: "#/components/responses/FormOwnerMismatch" }
        "422": { description: File exceeds analysis limits or cannot be read }
        "429": { description: Analysis limit reached }
        "503": { description: AI unavailable or result could not be stored }
  /cases/{id}/documents/{documentId}/analyses/{analysisId}:
    delete:
      operationId: deleteDocumentAnalysis
      tags: [workspace]
      security: [{ FormOwner: [] }]
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer, minimum: 1 } }
        - { name: documentId, in: path, required: true, schema: { type: string, format: uuid } }
        - { name: analysisId, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        "204": { description: Selected analysis removed }
        "404": { description: Analysis unavailable }
  /openai/sbu/specialists:
    get:
      operationId: getSbuChatSpecialists
      tags: [workspace]
      summary: Standalone SBU specialist catalog, not the Gustafta knowledge base
      responses:
        "200":
          description: Specialist guidance catalog
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/SbuChatSpecialist" }
  /openai/sbu/messages:
    post:
      operationId: sendSbuChatMessage
      tags: [workspace]
      summary: Role-focused SBU AI guidance without reading company data or documents
      security: [{ FormOwner: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SbuChatInput" }
      responses:
        "200":
          description: Private preliminary AI guidance
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SbuChatReply" }
        "400":
          description: Invalid conversation or missing consent
        "401":
          description: Authentication required
        "409":
          $ref: "#/components/responses/FormOwnerMismatch"
        "429":
          description: Too many requests or another response is being generated
        "503":
          description: AI provider unavailable; no fabricated reply
  /company-profile:
    get:
      operationId: getLocalCompanyProfile
      tags: [workspace]
      summary: Read the current owner's standalone company profile
      responses:
        "200":
          description: Private company profile
          content:
            application/json:
              schema: { $ref: "#/components/schemas/LocalCompanyProfile" }
    put:
      operationId: putLocalCompanyProfile
      tags: [workspace]
      security: [{ FormOwner: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/LocalCompanyProfileInput" }
      responses:
        "200":
          description: Saved private company profile
          content:
            application/json:
              schema: { $ref: "#/components/schemas/LocalCompanyProfile" }
        "409":
          $ref: "#/components/responses/FormOwnerMismatch"
  /cases/{id}/documents:
    parameters:
      - { name: id, in: path, required: true, schema: { type: integer, minimum: 1 } }
    get:
      operationId: listCaseDocuments
      tags: [workspace]
      responses:
        "200":
          description: Documents for the current owner's case, including unfinished uploads
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/CaseDocument" }
    post:
      operationId: requestCaseDocumentUpload
      tags: [workspace]
      security: [{ FormOwner: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/DocumentUploadInput" }
      responses:
        "201":
          description: Upload reservation; PUT bytes directly to uploadURL, then complete
          content:
            application/json:
              schema:
                type: object
                required: [document, uploadURL]
                properties:
                  document: { $ref: "#/components/schemas/CaseDocument" }
                  uploadURL: { type: string }
        "409":
          $ref: "#/components/responses/FormOwnerMismatch"
  /cases/{id}/documents/{documentId}/complete:
    parameters:
      - { name: id, in: path, required: true, schema: { type: integer, minimum: 1 } }
      - { name: documentId, in: path, required: true, schema: { type: string, format: uuid } }
    post:
      operationId: completeCaseDocumentUpload
      tags: [workspace]
      security: [{ FormOwner: [] }]
      responses:
        "200":
          description: Checked and attached document
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CaseDocument" }
        "409":
          $ref: "#/components/responses/FormOwnerMismatch"
  /cases/{id}/documents/{documentId}:
    patch:
      operationId: updateCaseDocumentMetadata
      tags: [workspace]
      security: [{ FormOwner: [] }]
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer, minimum: 1 } }
        - { name: documentId, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/DocumentMetadataInput" }
      responses:
        "200":
          description: Updated labels; document bytes and ownership unchanged
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CaseDocument" }
        "404": { description: Document unavailable }
    parameters:
      - { name: id, in: path, required: true, schema: { type: integer, minimum: 1 } }
      - { name: documentId, in: path, required: true, schema: { type: string, format: uuid } }
    delete:
      operationId: deleteCaseDocument
      tags: [workspace]
      security: [{ FormOwner: [] }]
      responses:
        "204": { description: Document and stored bytes removed }
        "409":
          $ref: "#/components/responses/FormOwnerMismatch"
  /cases/{id}/documents/{documentId}/download:
    parameters:
      - { name: id, in: path, required: true, schema: { type: integer, minimum: 1 } }
      - { name: documentId, in: path, required: true, schema: { type: string, format: uuid } }
    get:
      operationId: downloadCaseDocument
      tags: [workspace]
      responses:
        "200":
          description: Private document download; ownership verified on every request
          content:
            application/octet-stream:
              schema: { type: string, format: binary }
  /workspace:
    get:
      operationId: getWorkspace
      tags: [sbu]
      summary: Read the current authenticated private workspace
      responses:
        "200":
          description: Private workspace and legacy case container
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Workspace"
        "401":
          description: Authentication required
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
  /me:
    get:
      operationId: getMe
      tags: [workspace]
      responses:
        "200":
          description: Current profile
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Profile"
    patch:
      operationId: updateMe
      security: [{ FormOwner: [] }]
      tags: [workspace]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProfileInput"
      responses:
        "409":
          $ref: "#/components/responses/FormOwnerMismatch"
        "200":
          description: Updated profile
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Profile"
  /ruang-simpan/company-profile:
    get:
      operationId: getRuangSimpanCompanyProfile
      tags: [workspace]
      description: Read the authenticated SBU owner's company profile using their server-managed Gustafta connection. No owner parameters or token input.
      responses:
        "200":
          description: Profile read from Ruang Simpan, bound to the current SBU identity
          headers:
            Cache-Control:
              schema: { type: string }
              description: private, no-store
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RuangSimpanCompanyProfileResponse"
        "400":
          description: Owner parameters or request body are not accepted
        "401":
          description: SBU session is missing or invalid
        "404":
          description: No connection is configured for this SBU owner
        "424":
          description: Gustafta connection is invalid or lacks profile read permission
        "429":
          description: Gustafta rate limit exceeded
        "503":
          description: Connection or source profile cannot be read safely
  /dashboard:
    get:
      operationId: getDashboard
      tags: [workspace]
      responses:
        "200":
          description: Current user's case summary
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Dashboard"
  /cases:
    get:
      operationId: listCases
      tags: [workspace]
      responses:
        "200":
          description: Cases owned by current user
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/SbuCase"
    post:
      operationId: createCase
      security: [{ FormOwner: [] }]
      tags: [workspace]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CaseInput"
      responses:
        "201":
          description: Created case
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SbuCase"
        "409":
          $ref: "#/components/responses/FormOwnerMismatch"
  /cases/{id}:
    parameters:
      - in: path
        name: id
        required: true
        schema:
          type: integer
    get:
      operationId: getCase
      tags: [workspace]
      responses:
        "200":
          description: Case detail
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SbuCase"
    patch:
      operationId: updateCase
      security: [{ FormOwner: [] }]
      tags: [workspace]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CaseUpdate"
      responses:
        "200":
          description: Updated case
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SbuCase"
        "409":
          $ref: "#/components/responses/FormOwnerMismatch"
    delete:
      operationId: deleteCase
      security: [{ FormOwner: [] }]
      tags: [workspace]
      responses:
        "409":
          $ref: "#/components/responses/FormOwnerMismatch"
        "204":
          description: Deleted
  /cases/{id}/evidence:
    parameters:
      - in: path
        name: id
        required: true
        schema:
          type: integer
    get:
      operationId: listEvidence
      tags: [workspace]
      responses:
        "200":
          description: Evidence declarations for case
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Evidence"
    post:
      operationId: addEvidence
      security: [{ FormOwner: [] }]
      tags: [workspace]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EvidenceInput"
      responses:
        "201":
          description: Evidence declaration created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Evidence"
        "409":
          description: Missing or mismatched form owner, or this evidence category is already recorded.
          content:
            application/json:
              schema:
                type: object
                required: [error]
                properties:
                  error: { type: string }
  /cases/{id}/evidence/{evidenceId}:
    parameters:
      - in: path
        name: id
        required: true
        schema:
          type: integer
      - in: path
        name: evidenceId
        required: true
        schema:
          type: integer
    patch:
      operationId: updateEvidence
      security: [{ FormOwner: [] }]
      tags: [workspace]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EvidenceUpdate"
      responses:
        "200":
          description: Updated evidence declaration
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Evidence"
        "409":
          $ref: "#/components/responses/FormOwnerMismatch"
    delete:
      operationId: deleteEvidence
      security: [{ FormOwner: [] }]
      tags: [workspace]
      responses:
        "409":
          $ref: "#/components/responses/FormOwnerMismatch"
        "204":
          description: Deleted
  /cases/{id}/preparation-summary:
    parameters:
      - in: path
        name: id
        required: true
        schema: { type: integer }
      - in: header
        name: X-SBU-Form-Owner
        required: true
        description: Account that initiated the export; must match the authenticated session.
        schema: { type: string }
    get:
      operationId: getPreparationSummary
      tags: [workspace]
      responses:
        "200":
          description: Private, self-contained printable HTML snapshot from current case and rules
          content:
            text/html:
              schema: { type: string }
        "400":
          description: Invalid case ID
        "401":
          description: Sign-in required
        "404":
          description: Case absent or not owned by this session
        "409":
          description: Initiating account does not match session
  /cases/{id}/assessment:
    parameters:
      - in: path
        name: id
        required: true
        schema:
          type: integer
    get:
      operationId: getAssessment
      tags: [workspace]
      responses:
        "200":
          description: Preliminary checklist, not a certification decision
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Assessment"
  /regulations:
    get:
      operationId: listRegulations
      tags: [workspace]
      responses:
        "200":
          description: Regulatory references and transition caveats
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Regulation"
  /transition-verifications:
    get:
      operationId: listTransitionVerifications
      tags: [workspace]
      description: Restricted to configured official-source reviewers.
      responses:
        "200":
          description: Current verification record for each reviewed track
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/TransitionVerification"
  /transition-verifications/{track}:
    parameters:
      - in: path
        name: track
        required: true
        schema: { type: string, enum: [transisi, transisi_operasional, transisi_konversi] }
    put:
      operationId: putTransitionVerification
      security: [{ FormOwner: [] }]
      tags: [workspace]
      description: Restricted to configured official-source reviewers; replaces the entire record, including any revoked approval.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TransitionVerificationInput"
      responses:
        "409":
          $ref: "#/components/responses/FormOwnerMismatch"
        "200":
          description: Recorded verification
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TransitionVerification"
components:
  responses:
    FormOwnerMismatch:
      description: Missing form owner or the authenticated Clerk account no longer matches the form's original account. No data is read or written. Reload before retrying.
      content:
        application/json:
          schema:
            type: object
            required: [error]
            properties:
              error: { type: string }
  securitySchemes:
    FormOwner:
      type: apiKey
      in: header
      name: X-SBU-Form-Owner
      description: Required mutation precondition containing the Clerk user ID captured when the form opens. This is not authentication; a valid Clerk session is still required. Missing or mismatched values return 409 before any data access. Supply through the generated client's request.headers.
  schemas:
    SbuChatInput:
      type: object
      required: [mode, messages, consent]
      properties:
        specialist:
          type: string
          enum: [sbuclaw, skemaclaw, lkutclaw, abuclaw, panduansbu, pjbuclaw, keuanganclaw, lkpmclaw, ossclaw, pub-lkutclaw, esimpanclaw, nspknavigatorclaw, smapclaw]
          default: sbuclaw
        mode:
          type: string
          enum: [bujk, pendamping, asesor, lsbu, asosiasi, umum]
        consent:
          type: boolean
        messages:
          type: array
          minItems: 1
          maxItems: 20
          items: { $ref: "#/components/schemas/SbuChatMessage" }
    SbuChatMessage:
      type: object
      required: [role, content]
      properties:
        role: { type: string, enum: [user, assistant] }
        content: { type: string, minLength: 1, maxLength: 12000 }
    SbuChatReply:
      type: object
      required: [userId, mode, specialist, answer, disclaimer]
      properties:
        specialist:
          type: string
          enum: [sbuclaw, skemaclaw, lkutclaw, abuclaw, panduansbu, pjbuclaw, keuanganclaw, lkpmclaw, ossclaw, pub-lkutclaw, esimpanclaw, nspknavigatorclaw, smapclaw]
        userId: { type: string }
        mode: { type: string, enum: [bujk, pendamping, asesor, lsbu, asosiasi, umum] }
        answer: { type: string }
        disclaimer: { type: string }
    SbuChatSpecialist:
      type: object
      required: [id, name, group, description, prompts, knowledgeStatus]
      properties:
        id:
          type: string
          enum: [sbuclaw, skemaclaw, lkutclaw, abuclaw, panduansbu, pjbuclaw, keuanganclaw, lkpmclaw, ossclaw, pub-lkutclaw, esimpanclaw, nspknavigatorclaw, smapclaw]
        name: { type: string }
        group: { type: string }
        description: { type: string }
        prompts:
          type: array
          items: { type: string }
        knowledgeStatus: { type: string }
    LocalCompanyProfileInput:
      type: object
      additionalProperties: false
      required: [companyName, nib, npwp, address, responsiblePerson]
      properties:
        companyName: { type: string, maxLength: 200 }
        nib: { type: string, maxLength: 13, pattern: '^(|[0-9]{13})$' }
        npwp: { type: string, maxLength: 32 }
        address: { type: string, maxLength: 2000 }
        responsiblePerson: { type: string, maxLength: 200 }
    LocalCompanyProfile:
      allOf:
        - { $ref: "#/components/schemas/LocalCompanyProfileInput" }
        - type: object
          required: [ownerId, updatedAt]
          properties:
            ownerId: { type: string }
            updatedAt: { type: string, format: date-time }
    DocumentUploadInput:
      type: object
      additionalProperties: false
      required: [name, size, contentType]
      properties:
        category: { type: string, enum: [legalitas, keuangan, personel, peralatan, pengalaman, smap, lainnya] }
        description: { type: string, maxLength: 2000 }
        versionOf: { type: string, format: uuid }
        name: { type: string, minLength: 1, maxLength: 180 }
        size: { type: integer, minimum: 1, maximum: 20971520 }
        contentType: { type: string, enum: [application/pdf, image/png, image/jpeg] }
    CaseDocument:
      type: object
      required: [id, caseId, ownerId, name, size, contentType, status, createdAt]
      properties:
        category: { type: string, enum: [legalitas, keuangan, personel, peralatan, pengalaman, smap, lainnya] }
        description: { type: string }
        seriesId: { type: string, format: uuid }
        version: { type: integer, minimum: 1 }
        id: { type: string, format: uuid }
        caseId: { type: integer }
        ownerId: { type: string }
        name: { type: string }
        size: { type: integer }
        contentType: { type: string }
        status: { type: string, enum: [pending, ready] }
        createdAt: { type: string, format: date-time }
    DocumentMetadataInput:
      type: object
      additionalProperties: false
      required: [name, category, description]
      properties:
        name: { type: string, minLength: 1, maxLength: 180 }
        category: { type: string, enum: [legalitas, keuangan, personel, peralatan, pengalaman, smap, lainnya] }
        description: { type: string, maxLength: 2000 }
    DocumentAnalysisInput:
      type: object
      additionalProperties: false
      required: [consent, focus]
      properties:
        consent: { type: boolean }
        focus: { type: string, enum: [kesiapan_sbu, legalitas, keuangan, personel, pengalaman, smap] }
        question: { type: string, maxLength: 2000 }
    DocumentAnalysisResult:
      type: object
      additionalProperties: false
      required: [summary, extracted, concerns, missingInformation, nextSteps]
      properties:
        summary: { type: string, minLength: 1, maxLength: 3000 }
        extracted:
          type: array
          maxItems: 12
          items:
            type: object
            required: [label, value, location]
            properties:
              label: { type: string, maxLength: 200 }
              value: { type: string, maxLength: 1500 }
              location: { type: string, maxLength: 200 }
        concerns:
          type: array
          maxItems: 8
          items: { type: string, maxLength: 1500 }
        missingInformation:
          type: array
          maxItems: 8
          items: { type: string, maxLength: 1500 }
        nextSteps:
          type: array
          maxItems: 8
          items: { type: string, maxLength: 1500 }
    DocumentAnalysis:
      type: object
      required: [id, documentId, caseId, ownerId, focus, result, model, createdAt, disclaimer]
      properties:
        id: { type: string, format: uuid }
        documentId: { type: string, format: uuid }
        caseId: { type: integer }
        ownerId: { type: string }
        focus: { type: string, enum: [kesiapan_sbu, legalitas, keuangan, personel, pengalaman, smap] }
        result: { $ref: "#/components/schemas/DocumentAnalysisResult" }
        model: { type: string }
        createdAt: { type: string, format: date-time }
        disclaimer: { type: string }
    Workspace:
      type: object
      required: [userId, orgId, role, clientIds, clients, disclaimer]
      properties:
        userId: { type: string }
        orgId: { type: integer }
        role: { type: string }
        clientIds:
          type: array
          items: { type: integer }
        clients:
          type: array
          items:
            type: object
            required: [id, name, businessType, isDefault]
            properties:
              id: { type: integer }
              name: { type: string }
              businessType: { type: ["string", "null"] }
              isDefault: { type: boolean }
        disclaimer: { type: string }
    RuangSimpanCompanyProfileResponse:
      type: object
      required: [userId, profile]
      properties:
        userId: { type: string }
        profile:
          $ref: "#/components/schemas/RuangSimpanCompanyProfile"
    RuangSimpanCompanyProfile:
      type: object
      required: [name, nib, address, revision, updated_at]
      properties:
        name: { type: string }
        nib: { type: string }
        address: { type: string }
        revision: { type: integer, minimum: 0 }
        updated_at:
          type: ["string", "null"]
          description: ISO timestamp from Gustafta; null when no profile has been entered
    HealthStatus:
      type: object
      required: [status]
      properties:
        status: { type: string }
    Profile:
      type: object
      required: [userId, role, displayName, organizationName]
      properties:
        userId: { type: string }
        role:
          type: string
          enum: [belum_dipilih, kontraktor, konsultan, profesional, asosiasi]
        displayName: { type: string }
        organizationName: { type: string }
    ProfileInput:
      type: object
      required: [role, displayName, organizationName]
      properties:
        role:
          type: string
          enum: [kontraktor, konsultan, profesional, asosiasi]
        # Orval emits RegExp without the Unicode flag, so enumerate BMP format
        # characters and common default-ignorables rather than using Unicode
        # properties. The route checks the full property (including astral
        # selectors) without restricting the script of visible name characters.
        displayName: { type: string, minLength: 1, maxLength: 120, pattern: '[^\s\x00-\x1f\x7f-\x9f\u00ad\u034f\u0600-\u0605\u061c\u06dd\u070f\u0890-\u0891\u08e2\u180b-\u180e\u200b-\u200f\u202a-\u202e\u2060-\u2064\u2066-\u206f\ufe00-\ufe0f\ufeff\ufff9-\ufffb]' }
        organizationName: { type: string, maxLength: 160 }
    SbuCase:
      type: object
      required: [id, companyName, requestType, qualification, classification, status, createdAt, updatedAt, existingSbuExpiresOn]
      properties:
        id: { type: integer }
        clientId: { type: ["integer", "null"] }
        companyName: { type: string }
        requestType: { type: string, enum: [baru, perpanjangan] }
        qualification: { type: string, enum: [kecil, menengah, besar] }
        classification: { type: string }
        status: { type: string, enum: [draf, ditinjau, selesai_persiapan] }
        existingSbuExpiresOn: { type: ["string", "null"], format: date }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
    CaseInput:
      type: object
      required: [companyName, requestType, qualification, classification]
      properties:
        companyName: { type: string, minLength: 2, maxLength: 160 }
        requestType: { type: string, enum: [baru, perpanjangan] }
        qualification: { type: string, enum: [kecil, menengah, besar] }
        classification: { type: string, minLength: 1, maxLength: 160 }
        existingSbuExpiresOn: { type: ["string", "null"], format: date }
    CaseUpdate:
      type: object
      properties:
        companyName: { type: string, minLength: 2, maxLength: 160 }
        requestType: { type: string, enum: [baru, perpanjangan] }
        qualification: { type: string, enum: [kecil, menengah, besar] }
        classification: { type: string, minLength: 1, maxLength: 160 }
        status: { type: string, enum: [draf, ditinjau, selesai_persiapan] }
        existingSbuExpiresOn: { type: ["string", "null"], format: date }
    Evidence:
      type: object
      required: [id, caseId, code, title, note, updatedAt]
      properties:
        id: { type: integer }
        caseId: { type: integer }
        code: { type: string }
        title: { type: string }
        note: { type: string }
        updatedAt: { type: string, format: date-time }
    EvidenceInput:
      type: object
      required: [code, title, note]
      properties:
        code: { type: string, minLength: 1, maxLength: 80 }
        title: { type: string, minLength: 1, maxLength: 160 }
        note: { type: string, maxLength: 1000 }
    EvidenceUpdate:
      type: object
      properties:
        title: { type: string, minLength: 1, maxLength: 160 }
        note: { type: string, maxLength: 1000 }
    Finding:
      type: object
      required: [code, title, status, detail, source]
      properties:
        code: { type: string }
        title: { type: string }
        status: { type: string, enum: [tercatat, perlu_bukti, perlu_tinjauan] }
        detail: { type: string }
        source: { type: string }
        transitionDate: { type: string, format: date, description: "Only present after official source and expert review for this track are approved." }
    TransitionVerificationInput:
      type: object
      required: [publisher, sourceUrl, documentNumber, signatory, issuedOn, scope, documentStatus, sourceVerified, expertName, expertOrganization, expertReview, expertReviewedOn, expertApproved]
      properties:
        publisher: { type: string, minLength: 2, maxLength: 160, pattern: '.*\S.*' }
        sourceUrl: { type: string, format: uri, pattern: '^https://' }
        documentNumber: { type: string, minLength: 1, maxLength: 160, pattern: '.*\S.*' }
        signatory: { type: string, minLength: 2, maxLength: 160, pattern: '.*\S.*' }
        issuedOn: { type: string, format: date }
        scope: { type: string, minLength: 2, maxLength: 2000, pattern: '.*\S.*' }
        documentStatus: { type: string, enum: [berlaku, dicabut, belum_terkonfirmasi] }
        sourceVerified: { type: boolean }
        expertName: { type: string, minLength: 2, maxLength: 160, pattern: '.*\S.*' }
        expertOrganization: { type: string, minLength: 2, maxLength: 160, pattern: '.*\S.*' }
        expertReview: { type: string, minLength: 2, maxLength: 2000, pattern: '.*\S.*' }
        expertReviewedOn: { type: string, format: date }
        expertApproved: { type: boolean }
    TransitionVerification:
      allOf:
        - $ref: "#/components/schemas/TransitionVerificationInput"
        - type: object
          required: [track, verifiedBy, updatedAt]
          properties:
            track: { type: string, enum: [transisi, transisi_operasional, transisi_konversi] }
            verifiedBy: { type: string }
            updatedAt: { type: string, format: date-time }
    Assessment:
      type: object
      required: [caseId, ruleset, status, recordedCount, requiredCount, disclaimer, findings]
      properties:
        caseId: { type: integer }
        ruleset: { type: string }
        status: { type: string, enum: [perlu_bukti, perlu_tinjauan] }
        recordedCount: { type: integer }
        requiredCount: { type: integer }
        disclaimer: { type: string }
        findings:
          type: array
          items:
            $ref: "#/components/schemas/Finding"
    Dashboard:
      type: object
      required: [total, draft, reviewing, prepared, recent]
      properties:
        total: { type: integer }
        draft: { type: integer }
        reviewing: { type: integer }
        prepared: { type: integer }
        recent:
          type: array
          items:
            $ref: "#/components/schemas/SbuCase"
    Regulation:
      type: object
      required: [id, title, detail, source, effectiveStatus, transitionFindings]
      properties:
        id: { type: string }
        title: { type: string }
        detail: { type: string }
        source: { type: string }
        effectiveStatus: { type: string, enum: [unverified, partial, verified] }
        transitionFindings:
          type: array
          items:
            $ref: "#/components/schemas/Finding"
