openapi: 3.1.0
info:
  title: Api
  version: 0.1.0
  description: Gustafta SBU Accelerator - persiapan bukti, bukan keputusan sertifikasi
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
  - name: workspace
paths:
  /cases/{id}/workroom/reviews:
    get:
      operationId: getWorkroomReviews
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer, minimum: 1 } }
      responses:
        '200':
          description: Private review sources and latest 50 immutable decisions
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ReviewWorkspace' }
        '401': { description: Authentication required }
        '404': { description: Case not found }
        '409': { description: Account precondition mismatch }
    post:
      operationId: createWorkroomReview
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer, minimum: 1 } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ReviewDecisionInput' }
      responses:
        '201':
          description: Immutable internal decision recorded against the reviewed snapshot
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ReviewRecord' }
        '400': { description: Invalid decision or selection }
        '401': { description: Authentication required }
        '404': { description: Selected owned materials unavailable }
        '409': { description: 'Account, materials or previous decision changed' }
  /cases/{id}/workroom/reviews/preview:
    post:
      operationId: previewWorkroomReview
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer, minimum: 1 } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ReviewSelection' }
      responses:
        '200':
          description: Exact private material snapshot for explicit human review
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ReviewPreview' }
        '400': { description: Invalid selection }
        '401': { description: Authentication required }
        '404': { description: Selected owned materials unavailable }
        '409': { description: Account precondition mismatch }
  /cases/{id}/workroom:
    parameters:
      - { name: id, in: path, required: true, schema: { type: integer, minimum: 1 } }
    get:
      operationId: getWorkroom
      responses:
        "200":
          description: Private case workroom
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Workroom" }
    post:
      operationId: createWorkroomItem
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/WorkroomItemInput" }
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/WorkroomItem" }
  /cases/{id}/workroom/{itemId}:
    parameters:
      - { name: id, in: path, required: true, schema: { type: integer, minimum: 1 } }
      - { name: itemId, in: path, required: true, schema: { type: string, format: uuid } }
    patch:
      operationId: updateWorkroomItem
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/WorkroomItemUpdate" }
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema: { $ref: "#/components/schemas/WorkroomItem" }
    delete:
      operationId: deleteWorkroomItem
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/WorkroomItemDeletion" }
      responses:
        "204": { description: Deleted }
  /personnel:
    get:
      operationId: listPersonnel
      security: [{ FormOwner: [] }]
      responses:
        "200":
          description: Private personnel register; dates and certificates are user declarations, not verified eligibility.
          content:
            application/json:
              schema: { type: array, items: { $ref: "#/components/schemas/Personnel" } }
        "401": { description: Authentication required }
        "409": { $ref: "#/components/responses/FormOwnerMismatch" }
    post:
      operationId: createPersonnel
      security: [{ FormOwner: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/PersonnelInput" }
      responses:
        "201":
          description: Personnel recorded
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Personnel" }
        "400": { description: Invalid fields }
        "404": { description: Case not found or not owned }
        "409": { $ref: "#/components/responses/FormOwnerMismatch" }
  /personnel/{personnelId}:
    parameters:
      - { name: personnelId, in: path, required: true, schema: { type: string, format: uuid } }
    get:
      operationId: getPersonnel
      security: [{ FormOwner: [] }]
      responses:
        "200":
          description: Personnel and their declared certificates
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Personnel" }
        "404": { description: Not found }
        "409": { $ref: "#/components/responses/FormOwnerMismatch" }
    patch:
      operationId: updatePersonnel
      security: [{ FormOwner: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/PersonnelUpdate" }
      responses:
        "200":
          description: Updated personnel
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Personnel" }
        "400": { description: Invalid fields or incompatible linked document }
        "404": { description: Not found }
        "409": { description: Owner mismatch or stale revision; reload before editing }
    delete:
      operationId: deletePersonnel
      security: [{ FormOwner: [] }]
      responses:
        "204": { description: Person and their certificate records deleted; source documents are retained }
        "404": { description: Not found }
        "409": { $ref: "#/components/responses/FormOwnerMismatch" }
  /personnel/{personnelId}/certificates:
    parameters:
      - { name: personnelId, in: path, required: true, schema: { type: string, format: uuid } }
    post:
      operationId: createSkkCertificate
      security: [{ FormOwner: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SkkCertificateInput" }
      responses:
        "201":
          description: Declared certificate added; no verification or case assessment change
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Personnel" }
        "400": { description: Invalid dates or unavailable document }
        "404": { description: Person or document not found }
        "409": { $ref: "#/components/responses/FormOwnerMismatch" }
  /personnel/{personnelId}/certificates/{certificateId}:
    parameters:
      - { name: personnelId, in: path, required: true, schema: { type: string, format: uuid } }
      - { name: certificateId, in: path, required: true, schema: { type: string, format: uuid } }
    patch:
      operationId: updateSkkCertificate
      security: [{ FormOwner: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SkkCertificateUpdate" }
      responses:
        "200":
          description: Updated declared certificate
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Personnel" }
        "400": { description: Invalid fields or dates }
        "404": { description: Not found }
        "409": { description: Owner mismatch or stale revision; reload before editing }
    delete:
      operationId: deleteSkkCertificate
      security: [{ FormOwner: [] }]
      responses:
        "204": { description: Certificate record deleted; source document retained }
        "404": { description: Not found }
        "409": { $ref: "#/components/responses/FormOwnerMismatch" }
  /consultations:
    get:
      operationId: listConsultations
      tags: [workspace]
      security: [{ FormOwner: [] }]
      responses:
        "200":
          description: Private consultation list, newest first
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/ConsultationSummary" }
    post:
      operationId: createConsultation
      tags: [workspace]
      security: [{ FormOwner: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CreateConsultationInput" }
      responses:
        "201":
          description: Created consultation
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Consultation" }
  /cases/{id}/documents/{documentId}/analyses/{analysisId}/consultation-preview:
    parameters:
      - { name: id, in: path, required: true, schema: { type: integer, minimum: 1 } }
      - { name: documentId, in: path, required: true, schema: { type: string, format: uuid } }
      - { name: analysisId, in: path, required: true, schema: { type: string, format: uuid } }
    get:
      operationId: getConsultationAnalysisPreview
      tags: [sbu]
      responses:
        "200":
          description: Private analysis text for explicit excerpt selection; no original file read
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ConsultationAnalysisPreview" }
        "404": { description: Source not owned or unavailable }
        "409": { description: Source version cannot be confirmed }
  /consultations/{id}:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
    get:
      operationId: getConsultation
      tags: [workspace]
      security: [{ FormOwner: [] }]
      responses:
        "200":
          description: Owner's consultation
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Consultation" }
    patch:
      operationId: renameConsultation
      tags: [workspace]
      security: [{ FormOwner: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/RenameConsultationInput" }
      responses:
        "200":
          description: Renamed consultation
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Consultation" }
    delete:
      operationId: deleteConsultation
      tags: [workspace]
      security: [{ FormOwner: [] }]
      responses:
        "204": { description: Deleted }
  /consultations/{id}/messages:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
    post:
      operationId: sendConsultationMessage
      tags: [workspace]
      security: [{ FormOwner: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ConsultationMessageInput" }
      responses:
        "200":
          description: Persisted answer and conversation
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Consultation" }
        "503":
          description: Operational AI budget exhausted/unverifiable or provider unavailable; no message saved
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AiUnavailable" }
  /documents:
    get:
      operationId: listDocumentVault
      security: [{ FormOwner: [] }]
      tags: [workspace]
      parameters:
        - { name: q, in: query, schema: { type: string, maxLength: 100 } }
        - { name: category, in: query, schema: { type: string, enum: [legalitas, keuangan, personel, peralatan, pengalaman, smap, lainnya] } }
        - { name: caseId, in: query, schema: { type: integer, minimum: 1 } }
        - { name: page, in: query, schema: { type: integer, minimum: 1, maximum: 10000, default: 1 } }
      responses:
        "409":
          $ref: "#/components/responses/FormOwnerMismatch"
        "200":
          description: Private paginated document vault
          content:
            application/json:
              schema:
                type: object
                required: [userId, documents, total, page, pageSize]
                properties:
                  userId: { type: string }
                  documents:
                    type: array
                    items:
                      allOf:
                        - { $ref: "#/components/schemas/CaseDocument" }
                        - type: object
                          required: [caseName]
                          properties:
                            caseName: { type: string }
                  total: { type: integer }
                  page: { type: integer }
                  pageSize: { type: integer }
  /cases/{id}/documents/{documentId}/analysis-source:
    get:
      operationId: getDocumentAnalysisSource
      security: [{ FormOwner: [] }]
      tags: [workspace]
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer, minimum: 1 } }
        - { name: documentId, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        "200":
          description: Local page inspection only; no data sent to AI
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DocumentAnalysisSource" }
        "401": { description: Sign in required }
        "404": { description: Document unavailable }
        "409": { $ref: "#/components/responses/FormOwnerMismatch" }
        "422": { description: Source cannot be read }
        "429": { description: Local inspection limit reached }
  /cases/{id}/documents/{documentId}/analyses:
    parameters:
      - { name: id, in: path, required: true, schema: { type: integer, minimum: 1 } }
      - { name: documentId, in: path, required: true, schema: { type: string, format: uuid } }
    get:
      operationId: listDocumentAnalyses
      security: [{ FormOwner: [] }]
      tags: [workspace]
      responses:
        "409":
          $ref: "#/components/responses/FormOwnerMismatch"
        "200":
          description: Preliminary analyses for this owner's selected document
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/DocumentAnalysis" }
    post:
      operationId: analyzeCaseDocument
      tags: [workspace]
      security: [{ FormOwner: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/DocumentAnalysisInput" }
      responses:
        "201":
          description: Persisted preliminary analysis, not verified evidence
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DocumentAnalysis" }
        "400": { description: Invalid input or missing consent }
        "404": { description: Document unavailable }
        "409": { $ref: "#/components/responses/FormOwnerMismatch" }
        "422": { description: File exceeds analysis limits or cannot be read }
        "429": { description: Analysis limit reached }
        "503":
          description: Operational AI budget exhausted/unverifiable, AI unavailable or result could not be stored
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AiUnavailable" }
  /cases/{id}/documents/{documentId}/analyses/{analysisId}:
    delete:
      operationId: deleteDocumentAnalysis
      tags: [workspace]
      security: [{ FormOwner: [] }]
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer, minimum: 1 } }
        - { name: documentId, in: path, required: true, schema: { type: string, format: uuid } }
        - { name: analysisId, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        "204": { description: Selected analysis removed }
        "404": { description: Analysis unavailable }
  /openai/sbu/source-reviews:
    get:
      operationId: listSbuChatSourceReviews
      tags: [workspace]
      security: [{ FormOwner: [] }]
      summary: Reviewer-only source versions and append-only review history, separate from transition verification
      responses:
        "200":
          description: Curated versions and review decisions
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SbuChatSourceReviews" }
        "401": { description: Authentication required }
        "403": { description: Trusted reviewer required }
        "409": { $ref: "#/components/responses/FormOwnerMismatch" }
        "503": { description: Review storage unavailable }
    post:
      operationId: recordSbuChatSourceReview
      tags: [workspace]
      security: [{ FormOwner: [] }]
      summary: Record a reviewed approval, replacement or withdrawal of a curated source version
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SbuChatSourceReviewInput" }
      responses:
        "201":
          description: Append-only review decision
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SbuChatSourceDecision" }
        "400": { description: Invalid review or unknown curated version }
        "401": { description: Authentication required }
        "403": { description: Trusted reviewer required }
        "409": { description: Session or source revision changed; read the current review before retrying }
        "503": { description: Review storage unavailable }
  /openai/sbu/specialists:
    get:
      operationId: getSbuChatSpecialists
      tags: [workspace]
      summary: Standalone SBU specialist catalog, not the Gustafta knowledge base
      responses:
        "200":
          description: Specialist guidance catalog
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/SbuChatSpecialist" }
  /openai/sbu/quota:
    get:
      operationId: getSbuChatQuota
      tags: [workspace]
      security: [{ FormOwner: [] }]
      summary: Current server-session account quota; daily reset at 00:00 UTC (07:00 WIB)
      responses:
        "200":
          description: Private quota snapshot
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SbuChatQuota" }
        "401": { description: Authentication required }
        "409": { $ref: "#/components/responses/FormOwnerMismatch" }
        "503": { description: Shared quota database unavailable; no AI request allowed }
  /openai/sbu/messages:
    post:
      operationId: sendSbuChatMessage
      tags: [workspace]
      summary: Role-focused SBU AI guidance without reading company data or documents
      security: [{ FormOwner: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SbuChatInput" }
      responses:
        "200":
          description: Private preliminary AI guidance
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SbuChatReply" }
        "400":
          description: Invalid conversation or missing consent
        "401":
          description: Authentication required
        "409":
          $ref: "#/components/responses/FormOwnerMismatch"
        "429":
          description: Too many requests or another response is being generated
          headers:
            Retry-After:
              schema: { type: integer }
              description: Seconds until the blocking quota can be retried
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SbuChatLimitError" }
        "503":
          description: Operational AI budget exhausted/unverifiable or AI provider unavailable; no fabricated reply
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SbuChatUnavailable" }
  /company-profile:
    get:
      operationId: getLocalCompanyProfile
      security: [{ FormOwner: [] }]
      tags: [workspace]
      summary: Read the current owner's standalone company profile
      responses:
        "409":
          $ref: "#/components/responses/FormOwnerMismatch"
        "200":
          description: Private company profile
          content:
            application/json:
              schema: { $ref: "#/components/schemas/LocalCompanyProfile" }
    put:
      operationId: putLocalCompanyProfile
      tags: [workspace]
      security: [{ FormOwner: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/LocalCompanyProfileInput" }
      responses:
        "200":
          description: Saved private company profile
          content:
            application/json:
              schema: { $ref: "#/components/schemas/LocalCompanyProfile" }
        "409":
          $ref: "#/components/responses/FormOwnerMismatch"
  /cases/{id}/documents:
    parameters:
      - { name: id, in: path, required: true, schema: { type: integer, minimum: 1 } }
    get:
      operationId: listCaseDocuments
      security: [{ FormOwner: [] }]
      tags: [workspace]
      responses:
        "409":
          $ref: "#/components/responses/FormOwnerMismatch"
        "200":
          description: Documents for the current owner's case, including unfinished uploads
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/CaseDocument" }
    post:
      operationId: requestCaseDocumentUpload
      tags: [workspace]
      security: [{ FormOwner: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/DocumentUploadInput" }
      responses:
        "201":
          description: Upload reservation; PUT bytes directly to uploadURL, then complete
          content:
            application/json:
              schema:
                type: object
                required: [document, uploadURL]
                properties:
                  document: { $ref: "#/components/schemas/CaseDocument" }
                  uploadURL: { type: string }
        "409":
          $ref: "#/components/responses/FormOwnerMismatch"
  /cases/{id}/documents/{documentId}/complete:
    parameters:
      - { name: id, in: path, required: true, schema: { type: integer, minimum: 1 } }
      - { name: documentId, in: path, required: true, schema: { type: string, format: uuid } }
    post:
      operationId: completeCaseDocumentUpload
      tags: [workspace]
      security: [{ FormOwner: [] }]
      responses:
        "200":
          description: Stored privately and locally scanned; scan failure or detection remains quarantined. Repeat to retry a failed or pending scan.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CaseDocument" }
        "409":
          $ref: "#/components/responses/FormOwnerMismatch"
  /cases/{id}/documents/{documentId}:
    patch:
      operationId: updateCaseDocumentMetadata
      tags: [workspace]
      security: [{ FormOwner: [] }]
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer, minimum: 1 } }
        - { name: documentId, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/DocumentMetadataInput" }
      responses:
        "200":
          description: Updated labels; document bytes and ownership unchanged
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CaseDocument" }
        "404": { description: Document unavailable }
    parameters:
      - { name: id, in: path, required: true, schema: { type: integer, minimum: 1 } }
      - { name: documentId, in: path, required: true, schema: { type: string, format: uuid } }
    delete:
      operationId: deleteCaseDocument
      tags: [workspace]
      security: [{ FormOwner: [] }]
      responses:
        "204": { description: Document and stored bytes removed }
        "409":
          $ref: "#/components/responses/FormOwnerMismatch"
  /cases/{id}/documents/{documentId}/download:
    parameters:
      - { name: id, in: path, required: true, schema: { type: integer, minimum: 1 } }
      - { name: documentId, in: path, required: true, schema: { type: string, format: uuid } }
    get:
      operationId: downloadCaseDocument
      security: [{ FormOwner: [] }]
      tags: [workspace]
      responses:
        "409":
          $ref: "#/components/responses/FormOwnerMismatch"
        "200":
          description: Private document download; ownership verified on every request
          content:
            application/octet-stream:
              schema: { type: string, format: binary }
  /workspace:
    get:
      operationId: getWorkspace
      security: [{ FormOwner: [] }]
      tags: [sbu]
      summary: Read the current authenticated private workspace
      responses:
        "409":
          $ref: "#/components/responses/FormOwnerMismatch"
        "200":
          description: Private workspace and legacy case container
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Workspace"
        "401":
          description: Authentication required
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
  /me:
    get:
      operationId: getMe
      security: [{ FormOwner: [] }]
      tags: [workspace]
      responses:
        "409":
          $ref: "#/components/responses/FormOwnerMismatch"
        "200":
          description: Current profile
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Profile"
    patch:
      operationId: updateMe
      security: [{ FormOwner: [] }]
      tags: [workspace]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProfileInput"
      responses:
        "409":
          $ref: "#/components/responses/FormOwnerMismatch"
        "200":
          description: Updated profile
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Profile"
  /dashboard:
    get:
      operationId: getDashboard
      security: [{ FormOwner: [] }]
      tags: [workspace]
      responses:
        "409":
          $ref: "#/components/responses/FormOwnerMismatch"
        "200":
          description: Current user's case summary
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Dashboard"
  /cases:
    get:
      operationId: listCases
      security: [{ FormOwner: [] }]
      tags: [workspace]
      responses:
        "409":
          $ref: "#/components/responses/FormOwnerMismatch"
        "200":
          description: Cases owned by current user
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/SbuCase"
    post:
      operationId: createCase
      security: [{ FormOwner: [] }]
      tags: [workspace]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CaseInput"
      responses:
        "201":
          description: Created case
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SbuCase"
        "409":
          $ref: "#/components/responses/FormOwnerMismatch"
  /cases/{id}:
    parameters:
      - in: path
        name: id
        required: true
        schema:
          type: integer
    get:
      operationId: getCase
      security: [{ FormOwner: [] }]
      tags: [workspace]
      responses:
        "409":
          $ref: "#/components/responses/FormOwnerMismatch"
        "200":
          description: Case detail
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SbuCase"
    patch:
      operationId: updateCase
      security: [{ FormOwner: [] }]
      tags: [workspace]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CaseUpdate"
      responses:
        "200":
          description: Updated case
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SbuCase"
        "409":
          $ref: "#/components/responses/FormOwnerMismatch"
    delete:
      operationId: deleteCase
      security: [{ FormOwner: [] }]
      tags: [workspace]
      responses:
        "409":
          $ref: "#/components/responses/FormOwnerMismatch"
        "204":
          description: Deleted
  /cases/{id}/evidence:
    parameters:
      - in: path
        name: id
        required: true
        schema:
          type: integer
    get:
      operationId: listEvidence
      security: [{ FormOwner: [] }]
      tags: [workspace]
      responses:
        "409":
          $ref: "#/components/responses/FormOwnerMismatch"
        "200":
          description: Evidence declarations for case
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Evidence"
    post:
      operationId: addEvidence
      security: [{ FormOwner: [] }]
      tags: [workspace]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EvidenceInput"
      responses:
        "201":
          description: Evidence declaration created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Evidence"
        "409":
          description: Missing or mismatched form owner, or this evidence category is already recorded.
          content:
            application/json:
              schema:
                type: object
                required: [error]
                properties:
                  error: { type: string }
  /cases/{id}/evidence/{evidenceId}:
    parameters:
      - in: path
        name: id
        required: true
        schema:
          type: integer
      - in: path
        name: evidenceId
        required: true
        schema:
          type: integer
    patch:
      operationId: updateEvidence
      security: [{ FormOwner: [] }]
      tags: [workspace]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EvidenceUpdate"
      responses:
        "200":
          description: Updated evidence declaration
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Evidence"
        "409":
          $ref: "#/components/responses/FormOwnerMismatch"
    delete:
      operationId: deleteEvidence
      security: [{ FormOwner: [] }]
      tags: [workspace]
      responses:
        "409":
          $ref: "#/components/responses/FormOwnerMismatch"
        "204":
          description: Deleted
  /cases/{id}/preparation-summary:
    parameters:
      - in: path
        name: id
        required: true
        schema: { type: integer }
      - in: header
        name: X-SBU-Form-Owner
        required: true
        description: Account that initiated the export; must match the authenticated session.
        schema: { type: string }
    get:
      operationId: getPreparationSummary
      tags: [workspace]
      responses:
        "200":
          description: Private self-contained printable HTML from one read-only repeatable-read snapshot of the owned case, evidence categories, rules, and case-linked owned personnel/SKK (Personnel contract). Includes assignments, levels, certificate numbers, declared issue/expiry dates, declaration timestamps, Asia/Jakarta asOf date indicators and owner/case-scoped document metadata only. Excludes private notes, storage paths and download links. Preparation declaration only, not SKK authenticity verification, assessment input or certification approval.
          content:
            text/html:
              schema: { type: string }
        "400":
          description: Invalid case ID
        "401":
          description: Sign-in required
        "404":
          description: Case absent or not owned by this session
        "409":
          description: Initiating account does not match session
  /cases/{id}/assessment:
    parameters:
      - in: path
        name: id
        required: true
        schema:
          type: integer
    get:
      operationId: getAssessment
      security: [{ FormOwner: [] }]
      tags: [workspace]
      responses:
        "409":
          $ref: "#/components/responses/FormOwnerMismatch"
        "200":
          description: Preliminary checklist, not a certification decision
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Assessment"
  /regulations:
    get:
      operationId: listRegulations
      tags: [workspace]
      responses:
        "200":
          description: Regulatory references and transition caveats
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Regulation"
  /transition-verifications:
    get:
      operationId: listTransitionVerifications
      security: [{ FormOwner: [] }]
      tags: [workspace]
      description: Restricted to configured official-source reviewers.
      responses:
        "409":
          $ref: "#/components/responses/FormOwnerMismatch"
        "200":
          description: Current verification record for each reviewed track
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/TransitionVerification"
  /transition-verifications/{track}:
    parameters:
      - in: path
        name: track
        required: true
        schema: { type: string, enum: [transisi, transisi_operasional, transisi_konversi] }
    put:
      operationId: putTransitionVerification
      security: [{ FormOwner: [] }]
      tags: [workspace]
      description: Restricted to configured official-source reviewers; replaces the entire record, including any revoked approval.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TransitionVerificationInput"
      responses:
        "409":
          $ref: "#/components/responses/FormOwnerMismatch"
        "200":
          description: Recorded verification
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TransitionVerification"
components:
  responses:
    FormOwnerMismatch:
      description: Missing initiating account or the authenticated Clerk account no longer matches the tab or form's original account. Applies to private reads and writes. No data is read or written. Reload before retrying.
      content:
        application/json:
          schema:
            type: object
            required: [error]
            properties:
              error: { type: string }
  securitySchemes:
    FormOwner:
      type: apiKey
      in: header
      name: X-SBU-Form-Owner
      description: Required account precondition for private reads and writes. Capture the tab/cache or form owner, not the current cookie. This is not authentication; ownership is always derived from the verified Clerk session. Missing or mismatched values return 409 before private data access. Private reads use Cache-Control private, no-store.
  schemas:
    ReviewSelection:
      type: object
      required: [workroomIds, evidenceIds, documentIds]
      properties:
        workroomIds:
          type: array
          maxItems: 50
          uniqueItems: true
          items: { type: string, format: uuid }
        evidenceIds:
          type: array
          maxItems: 50
          uniqueItems: true
          items: { type: integer, minimum: 1 }
        documentIds:
          type: array
          maxItems: 50
          uniqueItems: true
          items: { type: string, format: uuid }
    ReviewCase:
      type: object
      required: [id, companyName, requestType, qualification, classification, status, existingSbuExpiresOn, updatedAt]
      properties:
        id: { type: integer }
        companyName: { type: string }
        requestType: { type: string }
        qualification: { type: string }
        classification: { type: string }
        status: { type: string }
        existingSbuExpiresOn: { type: [string, 'null'] }
        updatedAt: { type: string }
    ReviewEvidence:
      type: object
      required: [id, code, title, note, updatedAt]
      properties:
        id: { type: integer }
        code: { type: string }
        title: { type: string }
        note: { type: string }
        updatedAt: { type: string }
    ReviewDocument:
      type: object
      description: Metadata reference only, never file bytes, object paths or signed URLs
      required: [id, name, category, description, version, contentType, size, status, scanStatus, createdAt]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        category: { type: string }
        description: { type: string }
        version: { type: integer }
        contentType: { type: string }
        size: { type: integer }
        status: { type: string }
        scanStatus: { type: string }
        createdAt: { type: string }
    ReviewSnapshot:
      type: object
      required: [schemaVersion, case, workroomItems, evidence, documents]
      properties:
        schemaVersion: { type: string, enum: [review-v1] }
        case: { $ref: '#/components/schemas/ReviewCase' }
        workroomItems:
          type: array
          items: { $ref: '#/components/schemas/WorkroomItem' }
        evidence:
          type: array
          items: { $ref: '#/components/schemas/ReviewEvidence' }
        documents:
          type: array
          items: { $ref: '#/components/schemas/ReviewDocument' }
    ReviewPreview:
      type: object
      required: [selection, snapshot, snapshotHash, latestReviewId]
      properties:
        selection: { $ref: '#/components/schemas/ReviewSelection' }
        snapshot: { $ref: '#/components/schemas/ReviewSnapshot' }
        snapshotHash: { type: string, pattern: '^[a-f0-9]{64}$' }
        latestReviewId: { type: [string, 'null'] }
    ReviewDecisionInput:
      type: object
      required: [selection, snapshotHash, latestReviewId, decision, note, confirmed]
      properties:
        selection: { $ref: '#/components/schemas/ReviewSelection' }
        snapshotHash: { type: string, pattern: '^[a-f0-9]{64}$' }
        latestReviewId: { type: [string, 'null'], format: uuid }
        decision: { type: string, enum: [approved, needs_changes] }
        note: { type: string, minLength: 1, maxLength: 2000 }
        confirmed: { type: boolean }
    ReviewRecord:
      type: object
      required: [id, caseId, sequenceNo, decision, note, selection, snapshot, snapshotHash, decidedAt, current]
      properties:
        id: { type: string, format: uuid }
        caseId: { type: integer }
        sequenceNo: { type: integer, minimum: 1 }
        decision: { type: string, enum: [approved, needs_changes] }
        note: { type: string }
        selection: { $ref: '#/components/schemas/ReviewSelection' }
        snapshot: { $ref: '#/components/schemas/ReviewSnapshot' }
        snapshotHash: { type: string }
        decidedAt: { type: string }
        current: { type: boolean, description: Selected material and case attributes still match this historical snapshot; not an LSBU approval }
    ReviewWorkspace:
      type: object
      required: [caseId, materials, reviews, historyTruncated]
      properties:
        caseId: { type: integer }
        materials: { $ref: '#/components/schemas/ReviewSnapshot' }
        reviews:
          type: array
          items: { $ref: '#/components/schemas/ReviewRecord' }
        historyTruncated: { type: boolean }
    WorkroomItemDeletion:
      type: object
      required: [revision]
      properties:
        revision: { type: integer, minimum: 0 }
    Workroom:
      type: object
      required: [caseId, items]
      properties:
        caseId: { type: integer }
        items:
          type: array
          items: { $ref: "#/components/schemas/WorkroomItem" }
    WorkroomItemInput:
      type: object
      required: [kind, title]
      properties:
        kind: { type: string, enum: [checklist, action, journal] }
        title: { type: string, minLength: 1, maxLength: 200 }
        body: { type: string, maxLength: 10000 }
        status: { type: string, enum: [todo, doing, done] }
        assignee: { type: string, maxLength: 200 }
        dueOn: { type: ["string", "null"], pattern: '^\d{4}-\d{2}-\d{2}$' }
    WorkroomItemUpdate:
      type: object
      required: [revision]
      properties:
        revision: { type: integer, minimum: 0 }
        title: { type: string, minLength: 1, maxLength: 200 }
        body: { type: string, maxLength: 10000 }
        status: { type: string, enum: [todo, doing, done] }
        assignee: { type: string, maxLength: 200 }
        dueOn: { type: ["string", "null"], pattern: '^\d{4}-\d{2}-\d{2}$' }
    WorkroomItem:
      type: object
      required: [id, caseId, kind, title, body, status, assignee, dueOn, revision, createdAt, updatedAt]
      properties:
        id: { type: string, format: uuid }
        caseId: { type: integer }
        kind: { type: string, enum: [checklist, action, journal] }
        title: { type: string }
        body: { type: string }
        status: { type: string, enum: [todo, doing, done] }
        assignee: { type: string }
        dueOn: { type: ["string", "null"] }
        revision: { type: integer }
        createdAt: { type: string }
        updatedAt: { type: string }
    CalendarDay:
      type: [string, "null"]
      pattern: '^\d{4}-\d{2}-\d{2}$'
      description: Valid YYYY-MM-DD calendar day, never a timestamp; null means unknown or explicitly cleared.
    PersonnelInput:
      type: object
      additionalProperties: false
      required: [fullName, assignment]
      properties:
        fullName: { type: string, minLength: 1, maxLength: 160 }
        assignment: { type: string, enum: [pjbu, pjt, pjsk, lainnya] }
        position: { type: string, maxLength: 160 }
        caseId: { type: [integer, "null"], minimum: 1 }
        notes: { type: string, maxLength: 3000 }
    PersonnelUpdate:
      type: object
      additionalProperties: false
      required: [expectedRevision]
      properties:
        expectedRevision: { type: integer, minimum: 0 }
        fullName: { type: string, minLength: 1, maxLength: 160 }
        assignment: { type: string, enum: [pjbu, pjt, pjsk, lainnya] }
        position: { type: string, maxLength: 160 }
        caseId: { type: [integer, "null"], minimum: 1 }
        notes: { type: string, maxLength: 3000 }
    SkkCertificateInput:
      type: object
      additionalProperties: false
      required: [certificateNumber, issuer, jobTitle]
      properties:
        certificateNumber: { type: string, minLength: 1, maxLength: 160 }
        issuer: { type: string, minLength: 1, maxLength: 160 }
        jobTitle: { type: string, minLength: 1, maxLength: 160 }
        level: { type: [integer, "null"], minimum: 1, maximum: 9 }
        issuedOn: { $ref: "#/components/schemas/CalendarDay" }
        expiresOn: { $ref: "#/components/schemas/CalendarDay" }
        documentId: { type: [string, "null"], format: uuid }
        notes: { type: string, maxLength: 3000 }
    SkkCertificateUpdate:
      type: object
      additionalProperties: false
      required: [expectedRevision]
      properties:
        expectedRevision: { type: integer, minimum: 0 }
        certificateNumber: { type: string, minLength: 1, maxLength: 160 }
        issuer: { type: string, minLength: 1, maxLength: 160 }
        jobTitle: { type: string, minLength: 1, maxLength: 160 }
        level: { type: [integer, "null"], minimum: 1, maximum: 9 }
        issuedOn: { $ref: "#/components/schemas/CalendarDay" }
        expiresOn: { $ref: "#/components/schemas/CalendarDay" }
        documentId: { type: [string, "null"], format: uuid }
        notes: { type: string, maxLength: 3000 }
    SkkCertificate:
      type: object
      required: [id, personnelId, certificateNumber, issuer, jobTitle, level, issuedOn, expiresOn, documentId, documentName, documentCaseId, documentAvailable, notes, revision, createdAt, updatedAt, dateStatus, daysRemaining]
      properties:
        id: { type: string, format: uuid }
        personnelId: { type: string, format: uuid }
        certificateNumber: { type: string }
        issuer: { type: string }
        jobTitle: { type: string }
        level: { type: [integer, "null"] }
        issuedOn: { $ref: "#/components/schemas/CalendarDay" }
        expiresOn: { $ref: "#/components/schemas/CalendarDay" }
        documentId: { type: [string, "null"], format: uuid }
        documentName: { type: [string, "null"] }
        documentCaseId: { type: [integer, "null"] }
        documentAvailable: { type: boolean, description: Current storage readiness and malware scan allow downloads; not proof of authenticity }
        notes: { type: string }
        revision: { type: integer }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
        dateStatus: { type: string, enum: [unknown, not_yet_effective, active_declared, expiring, expired] }
        daysRemaining: { type: [integer, "null"] }
    Personnel:
      type: object
      required: [id, fullName, assignment, position, caseId, notes, revision, createdAt, updatedAt, certificates, asOfDate]
      properties:
        id: { type: string, format: uuid }
        fullName: { type: string }
        assignment: { type: string, enum: [pjbu, pjt, pjsk, lainnya] }
        position: { type: string }
        caseId: { type: [integer, "null"] }
        notes: { type: string }
        revision: { type: integer }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
        asOfDate: { type: string, pattern: '^\d{4}-\d{2}-\d{2}$', description: Calendar day in Asia/Jakarta used for declared validity date indicators }
        certificates: { type: array, items: { $ref: "#/components/schemas/SkkCertificate" } }
    ConsultationAnalysisSelection:
      type: object
      additionalProperties: false
      required: [documentId, analysisId, revision, excerpt, consent]
      properties:
        documentId: { type: string, format: uuid }
        analysisId: { type: string, format: uuid }
        revision: { type: string, pattern: "^[a-f0-9]{64}$" }
        excerpt: { type: string, minLength: 1, maxLength: 4000 }
        consent: { type: boolean, enum: [true] }
    ConsultationAnalysisPreview:
      type: object
      required: [caseId, documentId, analysisId, revision, sourceVersion, sourcePages, model, focus, createdAt, text]
      properties:
        caseId: { type: integer, minimum: 1 }
        documentId: { type: string, format: uuid }
        analysisId: { type: string, format: uuid }
        revision: { type: string }
        sourceVersion: { type: integer, minimum: 1 }
        sourcePages:
          type: array
          items: { type: integer, minimum: 1 }
        model: { type: string }
        focus: { type: string }
        createdAt: { type: string, format: date-time }
        text: { type: string, maxLength: 60000 }
    ConsultationMessage:
      type: object
      required: [id, role, content, createdAt]
      properties:
        id: { type: string, format: uuid }
        role: { type: string, enum: [user, assistant] }
        content: { type: string }
        createdAt: { type: string, format: date-time }
        requestId: { type: string, format: uuid }
    ConsultationSummary:
      type: object
      required: [id, title, mode, specialist, revision, createdAt, updatedAt]
      properties:
        id: { type: string, format: uuid }
        title: { type: string }
        mode: { type: string, enum: [bujk, pendamping, asesor, lsbu, asosiasi, umum] }
        specialist: { type: string, enum: [sbuclaw, skemaclaw, lkutclaw, abuclaw, panduansbu, pjbuclaw, keuanganclaw, lkpmclaw, ossclaw, pub-lkutclaw, esimpanclaw, nspknavigatorclaw, smapclaw] }
        caseId: { type: integer, nullable: true }
        revision: { type: integer }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
    Consultation:
      allOf:
        - { $ref: "#/components/schemas/ConsultationSummary" }
        - type: object
          required: [context, messages, disclaimer]
          properties:
            context: { type: string }
            messages:
              type: array
              items: { $ref: "#/components/schemas/ConsultationMessage" }
            disclaimer: { type: string }
    CreateConsultationInput:
      type: object
      additionalProperties: false
      required: [mode, specialist, title]
      properties:
        title: { type: string, minLength: 1, maxLength: 120 }
        mode: { type: string, enum: [bujk, pendamping, asesor, lsbu, asosiasi, umum] }
        specialist: { type: string, enum: [sbuclaw, skemaclaw, lkutclaw, abuclaw, panduansbu, pjbuclaw, keuanganclaw, lkpmclaw, ossclaw, pub-lkutclaw, esimpanclaw, nspknavigatorclaw, smapclaw] }
        caseId: { type: integer, minimum: 1 }
        includeCaseContext: { type: boolean }
        analysisSelection: { $ref: "#/components/schemas/ConsultationAnalysisSelection" }
        expectedCaseContext:
          type: object
          additionalProperties: false
          required: [companyName, requestType, classification, qualification, status]
          properties:
            companyName: { type: string }
            requestType: { type: string }
            classification: { type: string }
            qualification: { type: string }
            status: { type: string }
    RenameConsultationInput:
      type: object
      additionalProperties: false
      required: [title]
      properties:
        title: { type: string, minLength: 1, maxLength: 120 }
    ConsultationMessageInput:
      type: object
      additionalProperties: false
      required: [content, consent, revision, requestId]
      properties:
        content: { type: string, minLength: 1, maxLength: 4000 }
        consent: { type: boolean, enum: [true] }
        revision: { type: integer, minimum: 0 }
        requestId: { type: string, format: uuid }
    SbuChatInput:
      type: object
      required: [mode, messages, consent]
      properties:
        specialist:
          type: string
          enum: [sbuclaw, skemaclaw, lkutclaw, abuclaw, panduansbu, pjbuclaw, keuanganclaw, lkpmclaw, ossclaw, pub-lkutclaw, esimpanclaw, nspknavigatorclaw, smapclaw]
          default: sbuclaw
        mode:
          type: string
          enum: [bujk, pendamping, asesor, lsbu, asosiasi, umum]
        consent:
          type: boolean
        messages:
          type: array
          minItems: 1
          maxItems: 20
          items: { $ref: "#/components/schemas/SbuChatMessage" }
    SbuChatMessage:
      type: object
      required: [role, content]
      properties:
        role: { type: string, enum: [user, assistant] }
        content: { type: string, minLength: 1, maxLength: 12000 }
    SbuChatQuota:
      type: object
      required: [userId, dailyLimit, dailyRemaining, dailyResetAt, minuteLimit, minuteRemaining, minuteResetAt, busy, retryAfterSeconds]
      properties:
        userId: { type: string }
        dailyLimit: { type: integer, minimum: 1 }
        dailyRemaining: { type: integer, minimum: 0 }
        dailyResetAt: { type: string, format: date-time }
        minuteLimit: { type: integer, minimum: 1 }
        minuteRemaining: { type: integer, minimum: 0 }
        minuteResetAt: { type: string, format: date-time }
        busy: { type: boolean }
        retryAfterSeconds: { type: integer, minimum: 0 }
    SbuChatLimitError:
      type: object
      required: [error, code, quota]
      properties:
        error: { type: string }
        code: { type: string, enum: [chat_busy, chat_minute_limit, chat_daily_limit] }
        quota: { $ref: "#/components/schemas/SbuChatQuota" }
    AiUnavailable:
      type: object
      required: [error]
      properties:
        error: { type: string }
        code:
          type: string
          enum: [ai_budget_exhausted, ai_budget_unavailable]
    SbuChatUnavailable:
      type: object
      required: [error]
      properties:
        error: { type: string }
        code:
          type: string
          enum: [ai_budget_exhausted, ai_budget_unavailable]
        quota: { $ref: "#/components/schemas/SbuChatQuota" }
    SbuChatReply:
      type: object
      required: [userId, mode, specialist, answer, disclaimer, citations, retrievalNotice, quota]
      properties:
        quota: { $ref: "#/components/schemas/SbuChatQuota" }
        specialist:
          type: string
          enum: [sbuclaw, skemaclaw, lkutclaw, abuclaw, panduansbu, pjbuclaw, keuanganclaw, lkpmclaw, ossclaw, pub-lkutclaw, esimpanclaw, nspknavigatorclaw, smapclaw]
        userId: { type: string }
        mode: { type: string, enum: [bujk, pendamping, asesor, lsbu, asosiasi, umum] }
        answer: { type: string }
        disclaimer: { type: string }
        retrievalNotice: { type: string }
        citations:
          type: array
          items: { $ref: "#/components/schemas/SbuChatCitation" }
    SbuChatSourceReviewInput:
      type: object
      additionalProperties: false
      required: [sourceKey, versionId, expectedRevision, status, reason, reviewReference]
      properties:
        sourceKey: { type: string, minLength: 1, maxLength: 100 }
        versionId: { type: string, minLength: 1, maxLength: 100 }
        expectedRevision: { type: integer, minimum: 0 }
        status: { type: string, enum: [approved, withdrawn, not_approved] }
        reason: { type: string, minLength: 1, maxLength: 2000 }
        reviewReference: { type: string, minLength: 1, maxLength: 1000 }
    SbuChatSourceDecision:
      allOf:
        - $ref: "#/components/schemas/SbuChatSourceReviewInput"
        - type: object
          required: [revision, reviewedBy, decidedAt, citations]
          properties:
            revision: { type: integer, minimum: 1 }
            reviewedBy: { type: string }
            decidedAt: { type: string }
            citations:
              type: array
              items: { $ref: "#/components/schemas/SbuChatCitation" }
    SbuChatSourceVersion:
      type: object
      required: [sourceKey, versionId, baseline, citations]
      properties:
        sourceKey: { type: string }
        versionId: { type: string }
        baseline: { type: boolean }
        citations:
          type: array
          items: { $ref: "#/components/schemas/SbuChatCitation" }
    SbuChatSourceReviews:
      type: object
      required: [versions, decisions]
      properties:
        versions:
          type: array
          items: { $ref: "#/components/schemas/SbuChatSourceVersion" }
        decisions:
          type: array
          items: { $ref: "#/components/schemas/SbuChatSourceDecision" }
    SbuChatCitation:
      type: object
      required: [id, document, version, locator, excerpt, sourceUrl, verificationStatus, verificationScope, documentStatus, checkedOn, limitation]
      properties:
        id: { type: string }
        document: { type: string }
        version: { type: string }
        locator: { type: string }
        excerpt: { type: string, description: "Ringkasan terkurasi, bukan kutipan verbatim." }
        sourceUrl: { type: string, format: uri }
        verificationStatus: { type: string, enum: [verified, unverified] }
        verificationScope: { type: string }
        documentStatus: { type: string }
        checkedOn: { type: string, pattern: '^\d{4}-\d{2}-\d{2}$', description: "Tanggal kalender pemeriksaan, bukan waktu verifikasi live." }
        limitation: { type: string }
    SbuChatSpecialist:
      type: object
      required: [id, name, group, description, prompts, knowledgeStatus]
      properties:
        id:
          type: string
          enum: [sbuclaw, skemaclaw, lkutclaw, abuclaw, panduansbu, pjbuclaw, keuanganclaw, lkpmclaw, ossclaw, pub-lkutclaw, esimpanclaw, nspknavigatorclaw, smapclaw]
        name: { type: string }
        group: { type: string }
        description: { type: string }
        prompts:
          type: array
          items: { type: string }
        knowledgeStatus: { type: string }
    LocalCompanyProfileInput:
      type: object
      additionalProperties: false
      required: [companyName, nib, npwp, address, responsiblePerson]
      properties:
        companyName: { type: string, maxLength: 200 }
        nib: { type: string, maxLength: 13, pattern: '^(|[0-9]{13})$' }
        npwp: { type: string, maxLength: 32 }
        address: { type: string, maxLength: 2000 }
        responsiblePerson: { type: string, maxLength: 200 }
    LocalCompanyProfile:
      allOf:
        - { $ref: "#/components/schemas/LocalCompanyProfileInput" }
        - type: object
          required: [ownerId, updatedAt]
          properties:
            ownerId: { type: string }
            updatedAt: { type: string, format: date-time }
    DocumentUploadInput:
      type: object
      additionalProperties: false
      required: [name, size, contentType]
      properties:
        category: { type: string, enum: [legalitas, keuangan, personel, peralatan, pengalaman, smap, lainnya] }
        description: { type: string, maxLength: 2000 }
        versionOf: { type: string, format: uuid }
        name: { type: string, minLength: 1, maxLength: 180 }
        size: { type: integer, minimum: 1, maximum: 20971520 }
        contentType: { type: string, enum: [application/pdf, image/png, image/jpeg] }
    CaseDocument:
      type: object
      required: [id, caseId, ownerId, name, size, contentType, status, scanStatus, createdAt]
      properties:
        category: { type: string, enum: [legalitas, keuangan, personel, peralatan, pengalaman, smap, lainnya] }
        description: { type: string }
        seriesId: { type: string, format: uuid }
        version: { type: integer, minimum: 1 }
        id: { type: string, format: uuid }
        caseId: { type: integer }
        ownerId: { type: string }
        name: { type: string }
        size: { type: integer }
        contentType: { type: string }
        status: { type: string, enum: [pending, ready] }
        scanStatus:
          type: string
          enum: [pending, clean, infected, error]
          description: Only clean documents may be downloaded or analyzed. A scan is not evidence or regulatory verification.
        scannedAt: { type: [string, "null"], format: date-time }
        createdAt: { type: string, format: date-time }
    DocumentMetadataInput:
      type: object
      additionalProperties: false
      required: [name, category, description]
      properties:
        name: { type: string, minLength: 1, maxLength: 180 }
        category: { type: string, enum: [legalitas, keuangan, personel, peralatan, pengalaman, smap, lainnya] }
        description: { type: string, maxLength: 2000 }
    DocumentAnalysisInput:
      type: object
      additionalProperties: false
      required: [consent, focus, sourceRevision, pages]
      properties:
        consent: { type: boolean }
        sourceRevision: { type: string, pattern: '^[a-f0-9]{64}$' }
        pages:
          type: array
          minItems: 1
          maxItems: 10
          uniqueItems: true
          items: { type: integer, minimum: 1 }
        focus: { type: string, enum: [kesiapan_sbu, legalitas, keuangan, personel, pengalaman, smap] }
        question: { type: string, maxLength: 2000 }
    DocumentAnalysisSource:
      type: object
      required: [documentId, version, sourceRevision, pageCount, model]
      properties:
        documentId: { type: string, format: uuid }
        version: { type: integer, minimum: 1 }
        sourceRevision: { type: string, pattern: '^[a-f0-9]{64}$' }
        pageCount: { type: integer, minimum: 1 }
        model: { type: string }
    DocumentAnalysisResult:
      type: object
      additionalProperties: false
      required: [summary, extracted, concerns, missingInformation, nextSteps]
      properties:
        summary: { type: string, minLength: 1, maxLength: 3000 }
        extracted:
          type: array
          maxItems: 12
          items:
            type: object
            required: [label, value, location]
            properties:
              label: { type: string, maxLength: 200 }
              value: { type: string, maxLength: 1500 }
              location: { type: string, maxLength: 200 }
        concerns:
          type: array
          maxItems: 8
          items: { type: string, maxLength: 1500 }
        missingInformation:
          type: array
          maxItems: 8
          items: { type: string, maxLength: 1500 }
        nextSteps:
          type: array
          maxItems: 8
          items: { type: string, maxLength: 1500 }
    DocumentAnalysis:
      type: object
      required: [id, documentId, caseId, ownerId, focus, result, model, createdAt, disclaimer, sourcePages, sourcePageCount, sourceVersion]
      properties:
        id: { type: string, format: uuid }
        sourcePages:
          type: [array, "null"]
          description: Payload page order mapped to original page numbers; null for legacy results with no snapshot
          items: { type: integer, minimum: 1 }
        sourcePageCount: { type: [integer, "null"] }
        sourceVersion: { type: [integer, "null"] }
        documentId: { type: string, format: uuid }
        caseId: { type: integer }
        ownerId: { type: string }
        focus: { type: string, enum: [kesiapan_sbu, legalitas, keuangan, personel, pengalaman, smap] }
        result: { $ref: "#/components/schemas/DocumentAnalysisResult" }
        model: { type: string }
        createdAt: { type: string, format: date-time }
        disclaimer: { type: string }
    Workspace:
      type: object
      required: [userId, orgId, role, clientIds, clients, disclaimer]
      properties:
        userId: { type: string }
        orgId: { type: integer }
        role: { type: string }
        clientIds:
          type: array
          items: { type: integer }
        clients:
          type: array
          items:
            type: object
            required: [id, name, businessType, isDefault]
            properties:
              id: { type: integer }
              name: { type: string }
              businessType: { type: ["string", "null"] }
              isDefault: { type: boolean }
        disclaimer: { type: string }
    HealthStatus:
      type: object
      required: [status]
      properties:
        status: { type: string }
    Profile:
      type: object
      required: [userId, role, displayName, organizationName]
      properties:
        userId: { type: string }
        role:
          type: string
          enum: [belum_dipilih, kontraktor, konsultan, profesional, asosiasi]
        displayName: { type: string }
        organizationName: { type: string }
    ProfileInput:
      type: object
      required: [role, displayName, organizationName]
      properties:
        role:
          type: string
          enum: [kontraktor, konsultan, profesional, asosiasi]
        # Orval emits RegExp without the Unicode flag, so enumerate BMP format
        # characters and common default-ignorables rather than using Unicode
        # properties. The route checks the full property (including astral
        # selectors) without restricting the script of visible name characters.
        displayName: { type: string, minLength: 1, maxLength: 120, pattern: '[^\s\x00-\x1f\x7f-\x9f\u00ad\u034f\u0600-\u0605\u061c\u06dd\u070f\u0890-\u0891\u08e2\u180b-\u180e\u200b-\u200f\u202a-\u202e\u2060-\u2064\u2066-\u206f\ufe00-\ufe0f\ufeff\ufff9-\ufffb]' }
        organizationName: { type: string, maxLength: 160 }
    SbuCase:
      type: object
      required: [id, companyName, requestType, qualification, classification, status, createdAt, updatedAt, existingSbuExpiresOn]
      properties:
        id: { type: integer }
        clientId: { type: ["integer", "null"] }
        companyName: { type: string }
        requestType: { type: string, enum: [baru, perpanjangan] }
        qualification: { type: string, enum: [kecil, menengah, besar] }
        classification: { type: string }
        status: { type: string, enum: [draf, ditinjau, selesai_persiapan] }
        existingSbuExpiresOn: { type: ["string", "null"], format: date }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
    CaseInput:
      type: object
      required: [companyName, requestType, qualification, classification]
      properties:
        companyName: { type: string, minLength: 2, maxLength: 160 }
        requestType: { type: string, enum: [baru, perpanjangan] }
        qualification: { type: string, enum: [kecil, menengah, besar] }
        classification: { type: string, minLength: 1, maxLength: 160 }
        existingSbuExpiresOn: { type: ["string", "null"], format: date }
    CaseUpdate:
      type: object
      properties:
        companyName: { type: string, minLength: 2, maxLength: 160 }
        requestType: { type: string, enum: [baru, perpanjangan] }
        qualification: { type: string, enum: [kecil, menengah, besar] }
        classification: { type: string, minLength: 1, maxLength: 160 }
        status: { type: string, enum: [draf, ditinjau, selesai_persiapan] }
        existingSbuExpiresOn: { type: ["string", "null"], format: date }
    Evidence:
      type: object
      required: [id, caseId, code, title, note, updatedAt]
      properties:
        id: { type: integer }
        caseId: { type: integer }
        code: { type: string }
        title: { type: string }
        note: { type: string }
        updatedAt: { type: string, format: date-time }
    EvidenceInput:
      type: object
      required: [code, title, note]
      properties:
        code: { type: string, minLength: 1, maxLength: 80 }
        title: { type: string, minLength: 1, maxLength: 160 }
        note: { type: string, maxLength: 1000 }
    EvidenceUpdate:
      type: object
      properties:
        title: { type: string, minLength: 1, maxLength: 160 }
        note: { type: string, maxLength: 1000 }
    Finding:
      type: object
      required: [code, title, status, detail, source]
      properties:
        code: { type: string }
        title: { type: string }
        status: { type: string, enum: [tercatat, perlu_bukti, perlu_tinjauan] }
        detail: { type: string }
        source: { type: string }
        transitionDate: { type: string, format: date, description: "Only present after official source and expert review for this track are approved." }
    TransitionVerificationInput:
      type: object
      required: [publisher, sourceUrl, documentNumber, signatory, issuedOn, scope, documentStatus, sourceVerified, expertName, expertOrganization, expertReview, expertReviewedOn, expertApproved]
      properties:
        publisher: { type: string, minLength: 2, maxLength: 160, pattern: '.*\S.*' }
        sourceUrl: { type: string, format: uri, pattern: '^https://' }
        documentNumber: { type: string, minLength: 1, maxLength: 160, pattern: '.*\S.*' }
        signatory: { type: string, minLength: 2, maxLength: 160, pattern: '.*\S.*' }
        issuedOn: { type: string, format: date }
        scope: { type: string, minLength: 2, maxLength: 2000, pattern: '.*\S.*' }
        documentStatus: { type: string, enum: [berlaku, dicabut, belum_terkonfirmasi] }
        sourceVerified: { type: boolean }
        expertName: { type: string, minLength: 2, maxLength: 160, pattern: '.*\S.*' }
        expertOrganization: { type: string, minLength: 2, maxLength: 160, pattern: '.*\S.*' }
        expertReview: { type: string, minLength: 2, maxLength: 2000, pattern: '.*\S.*' }
        expertReviewedOn: { type: string, format: date }
        expertApproved: { type: boolean }
    TransitionVerification:
      allOf:
        - $ref: "#/components/schemas/TransitionVerificationInput"
        - type: object
          required: [track, verifiedBy, updatedAt]
          properties:
            track: { type: string, enum: [transisi, transisi_operasional, transisi_konversi] }
            verifiedBy: { type: string }
            updatedAt: { type: string, format: date-time }
    Assessment:
      type: object
      required: [caseId, ruleset, status, recordedCount, requiredCount, disclaimer, findings]
      properties:
        caseId: { type: integer }
        ruleset: { type: string }
        status: { type: string, enum: [perlu_bukti, perlu_tinjauan] }
        recordedCount: { type: integer }
        requiredCount: { type: integer }
        disclaimer: { type: string }
        findings:
          type: array
          items:
            $ref: "#/components/schemas/Finding"
    Dashboard:
      type: object
      required: [total, draft, reviewing, prepared, recent]
      properties:
        total: { type: integer }
        draft: { type: integer }
        reviewing: { type: integer }
        prepared: { type: integer }
        recent:
          type: array
          items:
            $ref: "#/components/schemas/SbuCase"
    Regulation:
      type: object
      required: [id, title, detail, source, effectiveStatus, transitionFindings]
      properties:
        id: { type: string }
        title: { type: string }
        detail: { type: string }
        source: { type: string }
        effectiveStatus: { type: string, enum: [unverified, partial, verified] }
        transitionFindings:
          type: array
          items:
            $ref: "#/components/schemas/Finding"
