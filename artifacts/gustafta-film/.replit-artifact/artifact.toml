kind = "video"
videoAspectRatio = "16:9"
previewPath = "/gustafta-film/"
title = "Gustafta — Kumpulkan, baca, tindak lanjuti"
description = "Video pengenalan berbahasa Indonesia tentang persiapan SBU, Ruang Simpan mandiri, rujukan dan draf AI, serta tindak lanjut. Bukan penerbitan atau jaminan SBU."
version = "1.0.0"
id = "artifacts/gustafta-film"
router = "path"

[[services]]
name = "web"
paths = [ "/gustafta-film/" ]
localPort = 23021

[services.development]
run = "pnpm --filter @workspace/gustafta-film run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/gustafta-film", "run", "build" ]
serve = "static"
publicDir = "artifacts/gustafta-film/dist/public"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "23021"
BASE_PATH = "/gustafta-film/"
